<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CG Game</title>
    <link rel="stylesheet" href="css/style.css">

</head>
<body onload="loadPlane()">
    <div id="navBar">
        <h1>LOGO</h1>
    </div>

    <div id="containerDrop">
        <div class="dropdown">
            <button class="dropbtn"> Fases ▾ </button>
            <div class="dropdown-content">
                <a href="">Fase 1</a>
                <a href="">Fase 2</a>
                <a href="">Fase 3</a>
            </div>
        </div>
    </div>
    
    <div id="cartesianPlane">
        <div class="obj" id="square"></div>
        <div class="obj" id="circle"></div>
        <div class="transObj" id="rectangle"></div>

        <canvas id="plane"></canvas>
    </div>

    <div id="trys">
        <h2>
            Tentativas:
        </h2>
    </div>
    
    
    <button type="button" id="answerBtn"> Insira aqui a resposta... </button>
    <div id="responseField">
        <textarea id="response"></textarea>
        <!-- <button type="button" id="responseBtn"> Inserir </button> -->
    </div>
</body>
<script src="js/script.js"></script>
<script src="js/plano.js"></script>
</html>
