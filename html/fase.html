<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CG Game</title>
    <link rel="stylesheet" href="../css/fases.css">

</head>
<body >
    <div id="navBar">        
        <div id="navLinks">
            <a href="https://ko-fi.com/moveonapoie" target="_blank" title="Apoie o projeto">Doe um café ☕</a>
            <a href="ajuda.html" id="helpBtn" title="Como jogar?">Ajuda ❓</a>
            <a href="https://github.com/guilhermeandrd/pratica_de_cg-projeto_web" target="_blank" title="Veja o código fonte">GitHub 👾</a>
        </div>
    </div>

    <div id="levelControl">
        <div id="containerDrop">
            <div class="dropdown">
                <button class="dropbtn"> Fases ▾ </button>
                <div class="dropdown-content">
                    <a href="">Fase 1</a>
                    <a href="">Fase 2</a>
                    <a href="">Fase 3</a>
                </div>
            </div>
        </div>

        <div id="trys">
            <h2>
                Tentativas: 0
            </h2>
        </div>

    </div>
    
    <div id="cartesianPlane">
        <div class="rectangle" id="obj"></div>
        <div class="rectangle" id="transObj"></div>
    </div>
    

    <div id="responseContainment">
        <div id="responseField">
            <textarea id="response" placeholder="Insira aqui a resposta..."></textarea>
        </div>

        <button id="buttonVerify">Verificar</button>
    </div>

    <div id="customModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 id="modalTitle">Título</h2>
            <p id="modalMessage">Mensagem do modal</p>
            <button id="modalBtn">Continuar</button>
        </div>
    </div>
    
    <script src="../js/script.js"></script>
</body>
</html>
